name: Keep database awake (showroom hours)
on:
  schedule:
    - cron: "*/5 5-14 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "DATABASE_URL secret is missing"; exit 1; fi
          psql "$DATABASE_URL" -c "select 1;"
